app:
  description: クライアントWebサイト向けのRAG型公式チャットボットテンプレート
  icon: 💬
  icon_background: '#DBEAFE'
  mode: advanced-chat
  name: 公式AIチャットボット（テンプレート）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: |-
      こんにちは。[会社名]の公式AIアシスタントです。
      サービス、会社情報、お問い合わせについてご案内します。

      [[CHATBOT_CARD:services]]
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - どんなサービスがありますか？
    - 料金や利用方法を教えてください
    - 会社について教えてください
    - 問い合わせ方法を教えてください
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data: {isInIteration: false, isInLoop: false, sourceType: start, targetType: knowledge-retrieval}
      id: start-to-knowledge
      source: start
      sourceHandle: source
      target: knowledge
      targetHandle: target
      type: custom
      zIndex: 0
    - data: {isInIteration: false, isInLoop: false, sourceType: knowledge-retrieval, targetType: llm}
      id: knowledge-to-llm
      source: knowledge
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data: {isInIteration: false, isInLoop: false, sourceType: llm, targetType: answer}
      id: llm-to-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 54
      id: start
      position: {x: 40, y: 260}
      positionAbsolute: {x: 40, y: 260}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids: []
        desc: インポート後、公開情報だけを登録したクライアント用ナレッジベースを選択してください。
        metadata_filtering_conditions: null
        metadata_filtering_mode: disabled
        metadata_model_config: null
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: reranking_model
          reranking_model: null
          score_threshold: 0.3
          top_k: 5
        query_variable_selector: [sys, query]
        retrieval_mode: multiple
        selected: false
        single_retrieval_config: null
        title: クライアントナレッジ検索
        type: knowledge-retrieval
        vision: {enabled: false}
      height: 124
      id: knowledge
      position: {x: 360, y: 260}
      positionAbsolute: {x: 360, y: 260}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector: [knowledge, result]
        desc: インポート後にモデルを選択し、角括弧の項目とリンク・カード対応表を案件情報へ置換してください。
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix: {assistant: '', user: ''}
          window: {enabled: true, size: 6}
        model:
          completion_params: {max_tokens: 900, temperature: 0.2}
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - role: system
          text: |-
            あなたは[会社名]の公式AIアシスタントです。来訪者の質問に日本語で丁寧かつ簡潔に回答します。

            【対応範囲】
            [サービス、会社情報、採用など、このボットが回答する範囲]

            【必須ルール】
            1. 下記ナレッジとこの指示に根拠がない内容を推測で断言しません。
            2. 料金、納期、契約条件はナレッジにある範囲だけを「目安」として回答します。
            3. 個人情報、社内情報、クレーム、個別見積もりは担当者への問い合わせへ誘導します。
            4. 公式リンクは下記対応表のURLだけをMarkdownリンクで表示します。URLを推測しません。
            5. 関連カードは回答末尾に [[CHATBOT_CARD:カードID]] 形式で通常1件、最大2件出力します。
            6. 対象外の質問には対応範囲を簡潔に案内し、無理に回答しません。

            【公式リンク・カード対応表】
            ・サービス一覧: https://example.com/services / services
            ・サービスA: https://example.com/service-a / service-a
            ・サービスB: https://example.com/service-b / service-b
            ・お問い合わせ: https://example.com/contact / contact

            【問い合わせ誘導】
            詳しい内容については、担当者が直接ご案内します。
            [お問い合わせフォーム](https://example.com/contact)
            [[CHATBOT_CARD:contact]]

            【検索されたナレッジ】
            {{#context#}}
        - role: user
          text: '{{#sys.query#}}'
        selected: false
        title: 回答生成
        type: llm
        variables: []
        vision: {enabled: false}
      height: 116
      id: llm
      position: {x: 680, y: 260}
      positionAbsolute: {x: 680, y: 260}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm.text#}}'
        desc: ''
        selected: false
        title: Answer
        type: answer
        variables: []
      height: 104
      id: answer
      position: {x: 1000, y: 260}
      positionAbsolute: {x: 1000, y: 260}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport: {x: 0, y: 0, zoom: 0.8}
  rag_pipeline_variables: []
